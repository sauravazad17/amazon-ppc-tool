openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: keywords
    description: Amazon PPC keyword and ASIN generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /keywords/generate:
    post:
      operationId: generateKeywords
      tags: [keywords]
      summary: Generate Amazon PPC keywords and competitor ASINs
      description: Given a product title (and optional brand, category, price), generate 30 high-converting keywords (10 high intent, 10 core, 10 long-tail) plus 5 real competitor ASIN targets fetched from Amazon search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateKeywordsRequest"
      responses:
        "200":
          description: Generated keywords and competitor ASINs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /asin/lookup:
    get:
      operationId: lookupAsin
      tags: [keywords]
      summary: Look up an Amazon product title by ASIN
      parameters:
        - name: asin
          in: query
          required: true
          schema:
            type: string
            description: 10-character ASIN, e.g. B07FZ8S74R
      responses:
        "200":
          description: Product title resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsinLookupResponse"
        "400":
          description: Invalid ASIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ASIN not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    GenerateKeywordsRequest:
      type: object
      description: Provide product title OR ASIN (at least one). If only ASIN is given, the title is fetched from Amazon.
      properties:
        title:
          type: string
          nullable: true
          description: Product title (optional if asin provided)
        asin:
          type: string
          nullable: true
          description: Amazon ASIN (10 chars, starts with B0). Used to look up the title automatically when title is empty.
        brand:
          type: string
          nullable: true
          description: Optional brand name
        category:
          type: string
          nullable: true
          description: Optional product category
        priceRange:
          type: string
          nullable: true
          description: Optional price range (e.g. "$20-$30")
    Keyword:
      type: object
      properties:
        type:
          type: string
          enum: ["High Intent", "Core", "Long Tail"]
        value:
          type: string
      required:
        - type
        - value
    KeywordResult:
      type: object
      properties:
        resolvedTitle:
          type: string
          description: The product title used for generation (resolved from ASIN if needed)
        keywords:
          type: array
          items:
            $ref: "#/components/schemas/Keyword"
        competitor_asins:
          type: array
          items:
            type: string
      required:
        - resolvedTitle
        - keywords
        - competitor_asins
    AsinLookupResponse:
      type: object
      properties:
        asin:
          type: string
        title:
          type: string
      required:
        - asin
        - title
