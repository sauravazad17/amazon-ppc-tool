openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: keywords
    description: Amazon PPC keyword and ASIN generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /keywords/generate:
    post:
      operationId: generateKeywords
      tags: [keywords]
      summary: Generate Amazon PPC keywords and competitor ASINs
      description: Given a product title (and optional brand, category, price), generate 30 high-converting keywords (10 high intent, 10 core, 10 long-tail) plus 5 real competitor ASIN targets fetched from Amazon search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateKeywordsRequest"
      responses:
        "200":
          description: Generated keywords and competitor ASINs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /asin/lookup:
    get:
      operationId: lookupAsin
      tags: [keywords]
      summary: Look up an Amazon product title by ASIN
      parameters:
        - name: asin
          in: query
          required: true
          schema:
            type: string
            description: 10-character ASIN, e.g. B07FZ8S74R
      responses:
        "200":
          description: Product title resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsinLookupResponse"
        "400":
          description: Invalid ASIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ASIN not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    GenerateKeywordsRequest:
      type: object
      description: Provide one or more ASINs (preferred) or a single product title.
      properties:
        asins:
          type: array
          nullable: true
          maxItems: 15
          items:
            type: string
          description: List of Amazon ASINs (up to 15). Each ASIN must be 10 chars and start with B0.
        title:
          type: string
          nullable: true
          description: Single product title. Used only if asins is empty.
        brand:
          type: string
          nullable: true
          description: Optional brand override applied to all items
        category:
          type: string
          nullable: true
          description: Optional product category
        priceRange:
          type: string
          nullable: true
          description: Optional price range (e.g. "$20-$30")
    Keyword:
      type: object
      properties:
        type:
          type: string
          enum: ["High Intent", "Core", "Long Tail"]
        value:
          type: string
      required:
        - type
        - value
    ProductAnalysis:
      type: object
      description: Distilled understanding of the product
      properties:
        coreProduct:
          type: string
          description: The 1-3 word core product type (e.g. "Electric Toothbrush")
        attributes:
          type: array
          items:
            type: string
          description: Key product attributes detected (size, color, material, capacity, features)
        useCase:
          type: string
          nullable: true
          description: Primary use case
        audience:
          type: string
          nullable: true
          description: Target audience or shopper persona
      required:
        - coreProduct
        - attributes
    KeywordResultItem:
      type: object
      properties:
        asin:
          type: string
          nullable: true
          description: The input ASIN (if generated from an ASIN)
        title:
          type: string
          description: The product title used for generation
        image:
          type: string
          nullable: true
          description: Main product image URL scraped from the Amazon product page
        detectedBrand:
          type: string
          nullable: true
          description: The user's brand detected from the product page (used to exclude same-brand competitors)
        analysis:
          $ref: "#/components/schemas/ProductAnalysis"
        keywords:
          type: array
          items:
            $ref: "#/components/schemas/Keyword"
        competitor_asins:
          type: array
          items:
            type: string
        error:
          type: string
          nullable: true
          description: Error message if this item failed
      required:
        - title
        - keywords
        - competitor_asins
    KeywordResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KeywordResultItem"
      required:
        - items
    AsinLookupResponse:
      type: object
      properties:
        asin:
          type: string
        title:
          type: string
        brand:
          type: string
          nullable: true
      required:
        - asin
        - title
