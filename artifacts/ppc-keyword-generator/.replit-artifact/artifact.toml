kind = "web"
previewPath = "/"
title = "Amazon PPC Keyword Generator"
version = "1.0.0"
id = "artifacts/ppc-keyword-generator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25849

[services.development]
run = "pnpm --filter @workspace/ppc-keyword-generator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ppc-keyword-generator", "run", "build" ]
publicDir = "artifacts/ppc-keyword-generator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25849"
BASE_PATH = "/"
